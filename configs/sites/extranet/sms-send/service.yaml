# ============================================================
# 站点：sms-send（短信发送服务反代，公开访问）
# 网络区：extranet（外网）
# 类型：api（对外接口）
# 负责人：袁杰
# 后端：http://172.32.100.49:18888（短信发送服务）
# 访问域名：sms-send.ynfwyy.com（对应 *.ynfwyy.com 通配证书，无需单独 ssl.yaml）
# 说明：外网不走 PROXY protocol，请求直达 APISIX 标准 HTTP/HTTPS 监听口 80/443；
#       公开访问、不限制 IP（无 ip-restriction）。
# ============================================================
services:
  - name: sms-send-api
    description: 短信发送服务反代（公开访问）
    labels:
      site: sms-send
      zone: extranet          # 网络分区：外网
      site_type: api
      env: prod
      owner: 袁杰
      contact: 袁杰
    upstream:
      type: roundrobin
      scheme: http
      pass_host: pass
      nodes:
        - host: 172.32.100.49
          port: 18888
          weight: 100
    routes:
      - name: sms-send-root
        uris:
          - /*
        hosts:
          - sms-send.ynfwyy.com
        methods: [GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS]
        vars:
          - - server_port
            - "in"
            - ["80", "443"]     # APISIX 标准 HTTP/HTTPS 监听口（外网不走 PROXY；内网 9181/9182 入口不会命中）
        priority: 0
