# ============================================================
# 站点：sms-send（短信发送服务反代，公开访问）
# 网络区：extranet（外网）
# 类型：api（对外接口）
# 负责人：袁杰
# 后端：http://172.32.100.49:18888（短信发送服务）
# 访问域名：sms-send.ext.ynfwyy.com（对应 *.ext.ynfwyy.com 通配证书，见 global/ssls/wildcard-ext.yaml）
# 说明：外网不走 PROXY protocol，请求直达 APISIX 外网专属监听口 18080(HTTP)/19443(HTTPS)；
#       公开访问、不限制 IP（无 ip-restriction）。
# ============================================================
services:
  - name: sms-send-api
    description: 短信发送服务反代（公开访问）
    labels:
      site: sms-send
      zone: extranet          # 网络分区：外网
      site_type: api
      env: prod
      owner: 袁杰
      contact: 袁杰
    upstream:
      type: roundrobin
      scheme: http
      pass_host: pass
      nodes:
        - host: 172.32.100.49
          port: 18888
          weight: 100
    routes:
      - name: sms-send-root
        uris:
          - /*
        hosts:
          - sms-send.ext.ynfwyy.com
        methods: [GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS]
        vars:
          - - server_port
            - "in"
            - ["18080", "19443"]   # APISIX 外网专属监听口（HTTP/HTTPS，不走 PROXY；前置 DNAT 保留源 IP；内网 9181/9182 入口不会命中）
        priority: 0
