# ============================================================
# 站点：oms-ejinshui-cloud（数电发票管理系统反代，供 HRP 下载电子发票）
# 网络区：extranet（外网）
# 类型：partner（第三方厂家系统反代）
# 负责人：陈曦
# 后端：https://www.oms.ejinshui-cloud.com:443（数电发票管理系统）
# 访问域名：www-oms-ejinshui--cloud-com.ynfwyy.com（对应 *.ynfwyy.com 通配证书，无需单独 ssl.yaml）
# 说明：外网不走 PROXY protocol，请求直达 APISIX 外网专属监听口 18080(HTTP)/19443(HTTPS)；
#       IP 白名单 172.32.5.23（HRP 侧出口 IP，前置 LB 为 DNAT 保留源 IP，remote_addr 即客户端 IP）。
# 转发限制：仅代理 /fp/statics/（前端静态资源）与 /prod-api/（后端接口），其余路径一律不转发。
# ============================================================
services:
  - name: oms-ejinshui-cloud-partner
    description: 数电发票管理系统反代（HRP 下载电子发票）
    labels:
      site: oms-ejinshui-cloud
      zone: extranet          # 网络分区：外网
      site_type: partner
      env: prod
      owner: 陈曦
      contact: 陈曦
    upstream:
      type: roundrobin
      scheme: https
      pass_host: node         # 后端按虚拟主机路由，需透传 Host=www.oms.ejinshui-cloud.com（否则后端 vhost 匹配不上）
      nodes:
        - host: www.oms.ejinshui-cloud.com
          port: 443
          weight: 100
    routes:
      - name: oms-ejinshui-cloud-fp-api
        uris:
          - /fp/statics/*     # 前端静态资源（仅此前缀转发）
          - /prod-api/*       # 后端接口（仅此前缀转发）
        hosts:
          - www-oms-ejinshui--cloud-com.ynfwyy.com
        methods: [GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS]
        vars:
          - - server_port
            - "in"
            - ["18080", "19443"]   # APISIX 外网专属监听口（HTTP/HTTPS，不走 PROXY；前置 DNAT 保留源 IP；内网 9181/9182 入口不会命中）
        priority: 0
        plugins:
          ip-restriction:
            whitelist:
              - 172.32.5.23    # 仅放行 HRP 侧出口 IP，其余来源 403
