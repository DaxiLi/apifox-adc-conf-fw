# ============================================================
# 网络区模板：public（公网）—— 面向公网互联网的站点
# 规则：labels.zone 必须为 public，站点文件放 configs/sites/public/；
#       不走 PROXY protocol（只有内网才走 PP 9181/9182）、不要求 IP 限制（公网无法枚举客户端 IP）。
# 端口：互联网/公网专属 APISIX 标准 HTTP/HTTPS 监听口 80(HTTP)/443(HTTPS)，不走 PROXY；
#       路由用 vars: server_port in ["80","443"] 匹配（与内网 9181/9182、外网 18080/19443 隔离）。
# 用法：复制到 configs/sites/public/<site-code>/service.yaml，替换 <...> 占位符。
# 字段顺序规范：name → description → labels → upstream → routes
# ============================================================
services:
  - name: <site-code>-<用途>
    description: <站点中文名>
    labels:
      site: <site-code>
      zone: public              # 网络分区：公网（必须）
      site_type: <www/api/ws/static/admin/partner/internal>
      env: prod
      owner: <team>
      contact: <负责人>
    upstream:
      type: roundrobin
      scheme: http
      pass_host: pass
      nodes:
        - host: <后端地址>
          port: 80
          weight: 100
    routes:
      - name: <site-code>-root
        uris:
          - /*
        hosts:
          - <公网域名>
        methods: [GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS]
        vars:
          - - server_port
            - "in"
            - ["80", "443"]   # APISIX 标准 HTTP/HTTPS 监听口（互联网/公网专属，不走 PROXY）
        priority: 0
        plugins:
          limit-count:           # 公网站点建议基础限流（可选）
            count: 100
            time_window: 60
            rejected_code: 429
            key_type: var
            key: remote_addr     # 注意：前置 LB 未开 PROXY 时 remote_addr 是 LB 出口 IP，按需调整限流 key
