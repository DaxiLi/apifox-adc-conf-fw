# ============================================================
# 网络区模板：intranet（内网）—— 仅内网可访问的站点
# 硬性要求（违反即不合规，见 docs/配置仓库结构设计.md §网络分区）：
#   1. labels.zone 必须为 intranet，且站点文件必须放 configs/sites/intranet/
#   2. 必须走 PROXY protocol：real-ip 插件 + route vars 限定 server_port 9181/9182
#      （APISIX 前置 HAProxy 写入 PROXY 头，网关 proxy_protocol 端口解析出真实客户端 IP）
#   3. 必须带 ip-restriction 白名单（不允许留空）
# 用法：复制到 configs/sites/intranet/<site-code>/service.yaml，替换 <...> 占位符；
#       路由形态（uris/methods/插件）按 site_type 参考 _templates/ 下
#       www/api/websocket/static/admin 模板调整（如 WS 站点改 enable_websocket + 大读超时）。
# 字段顺序规范：name → description → labels → upstream → routes
# ============================================================
services:
  - name: <site-code>-<用途>
    description: <站点中文名>
    labels:
      site: <site-code>
      zone: intranet            # 网络分区：内网（必须）
      site_type: <www/api/ws/static/admin/partner/internal>
      env: prod
      owner: <team>
      contact: <负责人>
    upstream:
      type: roundrobin
      scheme: http
      pass_host: pass
      nodes:
        - host: <后端IP或内网域名>
          port: 80
          weight: 100
    routes:
      - name: <site-code>-root
        uris:
          - /*
        hosts:
          - <内网域名>
        methods: [GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS]
        vars:
          - - server_port
            - "in"
            - ["9181", "9182"]   # 内网仅监听 9181(HTTP)/9182(HTTPS) PROXY protocol 端口（必须）
        priority: 0
        plugins:
          real-ip:               # 必须：前置 HAProxy 走 PROXY protocol，取真实客户端 IP
            source: proxy_protocol_addr
            trusted_addresses:
              - <HAProxy IP>     # 例：172.32.9.2（填实际 HAProxy 地址）
          ip-restriction:        # 必须：内网 IP 白名单，不允许留空
            whitelist:
              - <内网客户端 IP 或网段>
