# ============================================================
# 站点类型模板：admin（管理后台）—— IP 白名单 + basic-auth
# 用法：复制到 configs/sites/<zone>/<site-code>/service.yaml
#   - 替换 <...> 占位符；补全 labels（zone/owner/contact 必填）
#   - zone 网络区安全块（PROXY/IP 限制）按网络区复制：intranet|extranet|public.yaml
#   - 配套：管理员 consumer 写 sites/<code>/consumers.yaml
#       （username: <site-code>-admin；credentials.type: basic-auth）
# ============================================================
services:
  - name: <site-code>-admin
    description: <站点名> 管理后台
    labels:
      site: <site-code>
      zone: <zone>            # 网络分区：intranet/extranet/public（必填）
      site_type: admin
      env: prod
      owner: <team>
    upstream:
      type: roundrobin
      scheme: http
      pass_host: pass
      nodes:
        - host: <后台内网地址>
          port: 8080
          weight: 100
    routes:
      - name: <site-code>-admin-root
        uris:
          - /*
        hosts:
          - admin.<主域名>
        methods: [GET, POST, PUT, DELETE, PATCH]
        priority: 0
        plugins:
          ip-restriction:
            whitelist:            # 仅公司出口/堡垒机
              - 172.16.0.0/12
          basic-auth: {}
