# ============================================================
# 站点类型模板：ws（WebSocket / 长连接）—— 开启 ws、放大读超时
# 用法：复制到 configs/sites/<zone>/<site-code>/service.yaml
#   - 替换 <...> 占位符；补全 labels（zone/owner/contact 必填）
#   - zone 网络区安全块（PROXY/IP 限制）按网络区复制：intranet|extranet|public.yaml
#   - 字段顺序规范：name → description → labels → upstream → routes
# ============================================================
services:
  - name: <site-code>-ws
    description: <站点名> WebSocket 服务
    labels:
      site: <site-code>
      zone: <zone>            # 网络分区：intranet/extranet/public（必填）
      site_type: ws
      env: prod
      owner: <team>
    upstream:
      type: roundrobin
      scheme: http
      pass_host: pass
      nodes:
        - host: <ws后端>
          port: 8080
          weight: 100
      timeout:
        connect: 10
        send: 60
        read: 3600          # 长连接读超时调大
    routes:
      - name: <site-code>-ws-socket
        uris:
          - /ws/*
        hosts:
          - ws.<主域名>
        methods: [GET]
        enable_websocket: true
        priority: 0
