# ============================================================
# 站点类型模板：static（静态资源/文件）—— 缓存 + 压缩
# 用法：复制到 configs/sites/<site-code>/service.yaml
#   - 替换 <...> 占位符；补全 labels（owner/contact 必填）
#   - 插件参数：docs/official/apisix/plugins/proxy-cache.md、gzip.md
# ============================================================
services:
  - name: <site-code>-static
    description: <站点名> 静态资源
    labels:
      site: <site-code>
      site_type: static
      env: prod
      owner: <team>
    upstream:
      type: roundrobin
      scheme: http
      pass_host: pass
      nodes:
        - host: <对象存储/静态服务器>
          port: 80
          weight: 100
    routes:
      - name: <site-code>-static-assets
        uris:
          - /static/*
          - /assets/*
        hosts:
          - <cdn或静态域名>
        methods: [GET, HEAD]
        priority: 0
        plugins:
          proxy-cache:
            cache_ttl: 3600
          gzip:
            min_length: 1024
